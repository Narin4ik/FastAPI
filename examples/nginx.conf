# Replace relay.example.com, certificate paths and 127.0.0.1:8280.
# Place this map in the http context (sites-enabled normally inherits it).
map $http_upgrade $relay_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    client_body_timeout 15s;

    # No request URL/header/body logging on this private API.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $relay_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
